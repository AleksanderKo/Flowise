name: Build Custom Flowise Image (GHCR)

# Builds a Docker image FROM THIS REPO'S SOURCE (root ./Dockerfile, which runs
# `pnpm build:docker`), so custom nodes like "S3 Universal Directory" are included.
# Pushes to GitHub Container Registry (ghcr.io) using the built-in GITHUB_TOKEN —
# no external secrets required.

on:
    push:
        branches:
            - main
            - feature/s3-storage-universal-loader
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag to push (in addition to branch/sha tags)'
                type: string
                required: false
                default: 'latest'

permissions:
    contents: read
    packages: write

concurrency:
    group: build-custom-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compute lowercase image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata (tags & labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
